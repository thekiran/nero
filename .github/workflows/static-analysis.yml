name: Offline static analysis
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  clang:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Workflow permission regressions
        run: python3 -m unittest tests/test_workflow_security.py
      - name: Existing portable CLI analysis
        run: make analyze
      - name: New foundation analysis
        run: |
          mkdir -p .build/analysis
          for source in src/core/platform.c src/modules/platform_info.c; do
            clang --analyze -std=c11 -Iinclude -Wall -Wextra -Werror -pedantic -Xanalyzer -analyzer-werror "$source" -o ".build/analysis/$(basename "$source").plist"
          done
  msvc:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cmake --preset windows-analysis
      - run: cmake --build --preset windows-analysis
      - run: ctest --preset windows-analysis
