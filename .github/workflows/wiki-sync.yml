name: Documentation and Wiki Sync

on:
  push:
    branches:
      - main
    paths:
      - 'README.md'
      - 'ROADMAP.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'docs/**'
      - 'scripts/docs/**'
      - 'tests/test_wiki_sync.py'
      - '.github/workflows/wiki-sync.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'ROADMAP.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'docs/**'
      - 'scripts/docs/**'
      - 'tests/test_wiki_sync.py'
      - '.github/workflows/wiki-sync.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wiki-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate documentation & Wiki generation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Run documentation and link audit
        run: python3 scripts/docs/wiki_sync.py --check

      - name: Run Wiki sync unit tests
        run: python3 -m unittest tests/test_wiki_sync.py

      - name: Build Wiki artifacts
        run: python3 scripts/docs/wiki_sync.py --build .build/wiki

      - name: Archive generated Wiki pages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wiki-pages
          path: .build/wiki/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish Wiki on main
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Verify Wiki without publishing
        run: |
          python3 scripts/docs/wiki_sync.py --check
          python3 scripts/docs/wiki_sync.py --build .build/wiki-preview

      - name: Clone and sync Wiki repository
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_PUSH_TOKEN }}
        run: python3 scripts/docs/wiki_publish.py
