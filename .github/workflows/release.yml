name: Release packages

on:
  push:
    branches: ['main']
    tags: ['v*']
    paths: ['.github/release-intent.json']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to build; a new tag is created after checks pass (v0.1.0)'
        required: true
        type: string
      publish:
        description: 'Publish after native installer and checksum verification'
        type: boolean
        default: false

permissions:
  contents: read

# No job needs dependency caches. Enforced by scoped cache-service tokens,
# independently of GITHUB_TOKEN permissions and PR merge-ref isolation.
cache-mode: none

concurrency:
  group: release-${{ github.event_name == 'pull_request' && github.ref || 'publication' }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prepare:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.ref.outputs.version }}
      commit: ${{ steps.ref.outputs.commit }}
      publish: ${{ steps.ref.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate version and resolve immutable source
        id: ref
        env:
          EVENT: ${{ github.event_name }}
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          publish=false
          commit=$(git rev-parse HEAD)
          test "$commit" = "$GITHUB_SHA" || { echo 'Unexpected checkout revision'; exit 1; }
          if [[ "$EVENT" == pull_request ]]; then
            version=v0.0.0-ci
            commit=$(git rev-parse HEAD)
          elif [[ "$EVENT" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            version=$(python3 -c 'import json; print(json.load(open(".github/release-intent.json"))["version"])')
            publish=$(python3 -c 'import json; print("true" if json.load(open(".github/release-intent.json")).get("publish") is True else "false")')
            [[ "$version" =~ ^v[0-9]+[.][0-9]+[.][0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]] || { echo 'Invalid release intent'; exit 1; }
            commit=$(git rev-parse HEAD)
            if git show-ref --verify --quiet "refs/tags/$version"; then
              tagged=$(git rev-parse --verify "refs/tags/$version^{commit}")
              test "$tagged" = "$commit" || { echo 'Release intent cannot move an existing tag'; exit 1; }
            fi
          else
            version=${REQUESTED_VERSION:-$GITHUB_REF_NAME}
            publish=${REQUESTED_PUBLISH:-false}
            [[ "$version" =~ ^v[0-9]+[.][0-9]+[.][0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]] || { echo 'Invalid version tag'; exit 1; }
            if git show-ref --verify --quiet "refs/tags/$version"; then
              tagged=$(git rev-parse --verify "refs/tags/$version^{commit}")
              test "$tagged" = "$commit" || { echo 'Requested tag must match the triggering revision'; exit 1; }
            elif [[ "$EVENT" == workflow_dispatch && "$GITHUB_REF" == refs/heads/main ]]; then
              commit=$(git rev-parse HEAD)
            else
              echo 'Missing tag; new versions must be dispatched from main'
              exit 1
            fi
          fi
          if [[ "$EVENT" != pull_request ]]; then
            git merge-base --is-ancestor "$commit" refs/remotes/origin/main || { echo 'Release source must belong to main history'; exit 1; }
          fi
          [[ "$publish" == true || "$publish" == false ]] || { echo 'Invalid publication mode'; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          python3 scripts/release/release_notes.py --version "$version" --commit "$commit" --output .build/release-notes-preview.md

  package:
    needs: prepare
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: macos-arm64
            preset: macos
            cc: clang
          - runner: macos-15-intel
            platform: macos-x86_64
            preset: macos
            cc: clang
          - runner: ubuntu-24.04
            platform: linux-x86_64
            preset: linux
            cc: gcc
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
            preset: linux
            cc: gcc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake python3 clang libcurl4-openssl-dev libcjson-dev libldns-dev libncurses-dev
      - name: Record toolchain
        run: |
          uname -a
          ${{ matrix.cc }} --version
          cmake --version
          python3 --version
      - name: Make regression tests and sanitizers
        run: |
          make test CC=${{ matrix.cc }}
          make test-sanitize CC=${{ matrix.cc }}
      - name: CMake regression tests and sanitizers
        run: |
          cmake --preset ${{ matrix.preset }}
          cmake --build --preset ${{ matrix.preset }} --parallel 4
          ctest --preset ${{ matrix.preset }} --no-tests=error
          cmake --preset ${{ matrix.preset }}-sanitize
          cmake --build --preset ${{ matrix.preset }}-sanitize --parallel 4
          ctest --preset ${{ matrix.preset }}-sanitize --no-tests=error
      - name: Build native release executable using authoritative Makefile
        run: |
          make CC=${{ matrix.cc }} -j4 NERO_RELEASE_VERSION="${{ needs.prepare.outputs.version }}"
          file nero
      - name: Verify system command installation without modifying the runner
        run: |
          staging="$RUNNER_TEMP/nero-install"
          make install DESTDIR="$staging"
          test -x "$staging/usr/local/bin/nero"
          cd "$RUNNER_TEMP"
          printf 'version\nexit\n' | env PATH="$staging/usr/local/bin:$PATH" nero
      - name: Package native executable and verify archive
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
          PLATFORM: ${{ matrix.platform }}
        run: python3 scripts/release/package.py --version "$VERSION" --platform "$PLATFORM" --commit "$COMMIT"
      - name: Build graphical macOS installer
        if: runner.os == 'macOS'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
        run: python3 scripts/release/package_macos.py --binary ./nero --version "$VERSION" --commit "$COMMIT"
      - name: Build native Linux package
        if: runner.os == 'Linux'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          sudo apt-get install -y dpkg-dev
          python3 scripts/release/package_deb.py --binary ./nero --version "$VERSION" --commit "$COMMIT" --output .build/release
      - name: Verify global command in normal and sudo shells
        env:
          NERO_LOG_FILE: ':memory:'
          NERO_HISTORY_FILE: ':memory:'
          EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$(uname -s)" = Darwin ]; then
            sudo installer -pkg ".build/release/nero-$EXPECTED_VERSION-${{ matrix.platform }}.pkg" -target /
            expected_command=/usr/local/bin/nero
          else
            sudo dpkg --install .build/release/*.deb
            expected_command=/usr/bin/nero
          fi
          cd "$RUNNER_TEMP"
          test "$(command -v nero)" = "$expected_command"
          printf 'version\nexit\n' | nero | grep -F "version $EXPECTED_VERSION"
          sudo -n env EXPECTED_COMMAND="$expected_command" EXPECTED_VERSION="$EXPECTED_VERSION" NERO_LOG_FILE=:memory: NERO_HISTORY_FILE=:memory: sh -ec 'cd /; test "$(command -v nero)" = "$EXPECTED_COMMAND"; printf "version\nexit\n" | nero | grep -F "version $EXPECTED_VERSION"'
          if [ "$(uname -s)" = Darwin ]; then
            sudo rm /usr/local/bin/nero
            sudo pkgutil --forget com.thekiran.nero
          else
            sudo dpkg --remove nero
          fi
      - name: Upload verified package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ matrix.platform }}
          path: .build/release/*
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true
      - name: Preserve CTest diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-logs-${{ matrix.platform }}
          path: .build/cmake/**/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 14
          include-hidden-files: true

  macos-pkg-upgrade:
    # Runs the upgrade fixture from this workflow's own checkout (no computed
    # ref) on a fresh runner. The older package is the exact artifact the
    # package job built and verified.
    name: macOS pkg upgrade (${{ matrix.platform }})
    needs: [prepare, package]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: macos-arm64
          - runner: macos-15-intel
            platform: macos-x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-${{ matrix.platform }}
          path: .build/release
      - name: Build macOS installer upgrade fixture
        env:
          UPGRADE_VERSION: v255.255.65535
          COMMIT: ${{ github.sha }}
        run: |
          make CC=clang -j4 BUILD_DIR=.build/pkg-upgrade TARGET=.build/pkg-upgrade/nero NERO_RELEASE_VERSION="$UPGRADE_VERSION"
          python3 scripts/release/package_macos.py --binary .build/pkg-upgrade/nero --version "$UPGRADE_VERSION" --commit "$COMMIT" --output .build/pkg-upgrade
      - name: Verify macOS installer upgrade and complete removal
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          UPGRADE_VERSION: v255.255.65535
          PLATFORM: ${{ matrix.platform }}
        run: sh tests/macos/pkg_lifecycle.sh upgrade ".build/release/nero-$VERSION-$PLATFORM.pkg" "$VERSION" ".build/pkg-upgrade/nero-$UPGRADE_VERSION-$PLATFORM.pkg" "$UPGRADE_VERSION"

  windows:
    name: windows-x86_64
    needs: prepare
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up native MinGW toolchain
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          # Use the runner's preinstalled MSYS2 (C:\msys64) instead of downloading
          # the installer, whose GitHub download intermittently fails with HTTP 504.
          release: false
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python
      - name: Build real Windows CLI and offline test targets
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gcc --version
          cmake -S . -B .build/windows-release -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc -DBUILD_TESTING=ON -DNERO_RELEASE_VERSION="$RELEASE_VERSION"
          cmake --build .build/windows-release --parallel 4
      - name: Test native CLI and interface adapter
        run: ctest --test-dir .build/windows-release --output-on-failure --no-tests=error
      - name: Package and test extracted standalone executable
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
        run: python scripts/release/package_windows.py --version "$VERSION" --commit "$COMMIT" --binary .build/windows-release/nero.exe
      - name: Build native Windows Installer wizard and upgrade fixture
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          python scripts/release/package_msi.py --version "$VERSION" --commit "$COMMIT" --binary .build/windows-release/nero.exe
          python scripts/release/package_msi.py --version "$VERSION" --commit "$COMMIT" --binary .build/windows-release/nero.exe --product-version 255.255.65535 --output .build/msi-upgrade
      - name: Verify MSI install, upgrade, PATH and removal
        shell: powershell
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $version = $env:VERSION
          & ./tests/windows/msi_lifecycle.ps1 -MsiPath ".build/release/nero-${version}-windows-x86_64.msi" -UpgradeMsiPath ".build/msi-upgrade/nero-${version}-windows-x86_64.msi" -ExpectedVersion $version
      - name: Upload verified Windows package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-windows-x86_64
          path: .build/release/*
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true
      - name: Preserve Windows CTest diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-logs-windows-x86_64
          path: |
            .build/windows-release/Testing/Temporary/LastTest.log
            .build/msi-test-logs/*
          if-no-files-found: ignore
          retention-days: 14
          include-hidden-files: true

  draft:
    needs: [prepare, package, macos-pkg-upgrade, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Verify portable archives and native installers with aggregate checksum
        working-directory: dist
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          for platform in macos-arm64 macos-x86_64 linux-x86_64 linux-arm64; do
            archive="nero-$VERSION-$platform.tar.gz"
            test -s "$archive"
            sha256sum --check "$archive.sha256"
          done
          archive="nero-$VERSION-windows-x86_64.zip"
          test -s "$archive"
          sha256sum --check "$archive.sha256"
          test "$(find . -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 4
          test "$(find . -maxdepth 1 -name '*.zip' | wc -l)" -eq 1
          for platform in macos-arm64 macos-x86_64; do
            test -s "nero-$VERSION-$platform.pkg"
            sha256sum --check "nero-$VERSION-$platform.pkg.sha256"
          done
          test -s "nero-$VERSION-windows-x86_64.msi"
          sha256sum --check "nero-$VERSION-windows-x86_64.msi.sha256"
          deb_version=$(python3 -c 'import os; print(os.environ["VERSION"][1:].replace("-", "~", 1))')
          for arch in amd64 arm64; do
            test -s "nero_${deb_version}_${arch}.deb"
            sha256sum --check "nero_${deb_version}_${arch}.deb.sha256"
          done
          test "$(find . -maxdepth 1 -name '*.pkg' | wc -l)" -eq 2
          test "$(find . -maxdepth 1 -name '*.deb' | wc -l)" -eq 2
          test "$(find . -maxdepth 1 -name '*.msi' | wc -l)" -eq 1
          cat ./*.sha256 | LC_ALL=C sort -k2 > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Preserve verified package set
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-release-set
          path: dist/*
          if-no-files-found: error
          retention-days: 7

      - name: Report pull request package verification
        if: github.event_name == 'pull_request'
        run: echo 'All five native installers, five portable archives and aggregate checksums verified. Publication requires an explicit main release intent or manual publish request; other builds remain drafts.' >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: [prepare, draft]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-release-set
          path: dist
      - name: Reverify immutable package bytes before publishing
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - name: Create draft and honor explicit publication request
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
          PUBLISH: ${{ needs.prepare.outputs.publish }}
        run: |
          set -euo pipefail
          # New main intents/manual versions receive a tag only after all checks pass.
          gh api --paginate "repos/$GH_REPO/git/matching-refs/tags/$VERSION" > refs.json
          tag_exists=$(jq -r --arg ref "refs/tags/$VERSION" '.[] | select(.ref == $ref) | .ref' refs.json)
          if [[ -z "$tag_exists" ]]; then
            gh api --method POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$VERSION" -f sha="$COMMIT"
          fi
          tagged_commit=$(gh api "repos/$GH_REPO/commits/$VERSION" --jq .sha)
          test "$tagged_commit" = "$COMMIT" || { echo 'Tag moved during build'; exit 1; }
          # Fail closed on API/auth errors; do not mistake them for a missing release.
          gh api --paginate "repos/$GH_REPO/releases?per_page=100" > releases.json
          release=$(jq -r --arg tag "$VERSION" '.[] | select(.tag_name == $tag) | .id' releases.json)
          if [[ -n "$release" ]]; then
            test "$(gh api "repos/$GH_REPO/releases/$release" --jq .draft)" = true || { echo 'Refusing to modify a published release'; exit 1; }
            gh release upload "$VERSION" dist/* --clobber
          else
            args=()
            [[ "$VERSION" != *-* ]] || args+=(--prerelease)
            gh release create "$VERSION" dist/* --verify-tag --draft --title "NERO $VERSION" --generate-notes "${args[@]}"
          fi
          gh release view "$VERSION" --json body --jq .body > current-release-notes.md
          python3 scripts/release/release_notes.py --version "$VERSION" --commit "$COMMIT" --body current-release-notes.md --output release-notes.md
          gh release edit "$VERSION" --notes-file release-notes.md
          if [[ "$PUBLISH" == true ]]; then
            args=()
            [[ "$VERSION" == *-* ]] || args+=(--latest)
            gh release edit "$VERSION" --draft=false "${args[@]}"
            test "$(gh release view "$VERSION" --json isDraft --jq .isDraft)" = false
            echo "Published $VERSION at $COMMIT: https://github.com/$GH_REPO/releases/tag/$VERSION" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Draft prepared for $VERSION at $COMMIT. Review five native installers and five portable archives before publication." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Clean up the merged release branch
        if: github.event_name != 'pull_request' && needs.prepare.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          set -euo pipefail
          pr=$(python3 -c 'import json; print(json.load(open(".github/release-intent.json")).get("pull_request", ""))')
          if [[ "$pr" =~ ^[0-9]+$ ]]; then
            gh api "repos/$GH_REPO/pulls/$pr" > publication-pr.json
            if jq -e --arg repo "$GH_REPO" --arg commit "$COMMIT" '.merged == true and .merge_commit_sha == $commit and .head.repo.full_name == $repo' publication-pr.json >/dev/null; then
              head=$(jq -r .head.ref publication-pr.json)
              expected=$(jq -r .head.sha publication-pr.json)
              if [[ -n "$head" && "$head" != main ]]; then
                gh api "repos/$GH_REPO/git/matching-refs/heads/$head" > publication-refs.json
                current=$(jq -r --arg ref "refs/heads/$head" '.[] | select(.ref == $ref) | .object.sha' publication-refs.json)
                if [[ "$current" == "$expected" ]]; then
                  gh api --method DELETE "repos/$GH_REPO/git/refs/heads/$head"
                  echo "Removed merged release branch $head." >> "$GITHUB_STEP_SUMMARY"
                fi
              fi
            fi
          fi


  release-checks:
    name: Release checks
    if: always()
    needs: [prepare, package, macos-pkg-upgrade, windows, draft, publish]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every supported platform
        env:
          PREPARE: ${{ needs.prepare.result }}
          POSIX: ${{ needs.package.result }}
          MACOS_PKG_UPGRADE: ${{ needs.macos-pkg-upgrade.result }}
          WINDOWS: ${{ needs.windows.result }}
          DRAFT: ${{ needs.draft.result }}
          PUBLICATION: ${{ needs.publish.result }}
          TRUSTED_PUBLICATION: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
        run: |
          test "$PREPARE" = success
          test "$POSIX" = success
          test "$MACOS_PKG_UPGRADE" = success
          test "$WINDOWS" = success
          test "$DRAFT" = success
          if [ "$TRUSTED_PUBLICATION" = true ]; then
            test "$PUBLICATION" = success
          else
            test "$PUBLICATION" = skipped
          fi
